  P.marks==="Struggling"?"Fix your weakest subject first: ask a teacher for help every week":P.marks==="60-80"?"Raise your marks by 10 points: list weak chapters and fix them":"Keep your marks high: aim for 90%+ in your key subjects",
  P.english==="Weak"?"Read English 20 minutes and write 5 sentences every day":P.english==="Okay"?"Read English 20 minutes daily and write one short piece weekly":"Read advanced English articles weekly",
  "Keep your daily routine going for 6+ weeks"]]];
 if(mid)R.push(["Build real things",["Finish 2-3 projects that real people use","Write a short README or write-up for each","Collect feedback from 3-5 real users","Enter one contest or competition in your field","Finish your exams with strong results"]]);
 if(ab)R.push(["Prove it",["Take a practice SAT, then study weak areas","Take the SAT (check each university's requirements)","Take an English test accepted by your universities","Pick and publish one flagship project","Pick 2 teachers as recommenders and brief them","Draft a list of 12-15 universities (reach, target, safe)",...ok(fin,["Check each university's aid policy for international students"])]],["Apply",["Write essay drafts (4-5 versions)","Finalize your university list","Submit applications before deadlines",...ok(fin,["Prepare financial documents and submit aid forms"]),"Confirm recommendations and scores arrived"]]);
 if(loc)R.push(["Prepare for admission",["Find the admission tests and requirements of your target universities","Practice past admission questions weekly","Draft a list of target universities and backups"]],["Apply",["Register for admission tests before deadlines","Prepare your documents","Submit applications","Finish your exams with strong results"]]);
 if(sk)R.push(["Show your work",["Build a simple portfolio page with your best 3 projects","Share one project publicly every month","Join one community or open-source project","Ask someone experienced for feedback"]]);
 return R}
function sumRows(P){const ab=P.goal==="Study abroad",lo=P.goal==="University in my country",late=["Class 11-12","Finished school"].includes(P.stage);
 const M={marks:{"90%+":"Strong base. Keep it up, since universities read your actual marks.","80-90%":"Good base. Aim for 90%+ in math and science over the next years.","60-80":"Room to grow. Raising your marks is the first priority.","Struggling":"Fix your weakest subject first. A strong base matters before everything else."},
 math:{Easy:"Your biggest strength. It helps with coding, tests and problem-solving contests.",Okay:"A solid base. A little practice every week will keep it growing.",Hard:"Not a blocker. Weekly practice on your weak topics will close the gap."},
 coding:{"Not started":"Start from the basics and write your own code. Do not skip fundamentals.",Some:"You have started. Now understand it deeply: rebuild programs without copying.",Regular:"A strong head start. Move on to real projects with real users."},
 english:{Strong:"A strength. Keep reading widely, it helps in essays, tests and university work.",Okay:"Needs a daily habit. It affects tests, essays and later university work.",Weak:"The weakest area. A daily reading and writing habit is the first priority."},
 time:{"Under 1 hour":"Short sessions work if you do them every day.","1-2 hours":"Enough, if you are consistent. Consistency beats long, rare sessions.","2-4 hours":"A strong schedule. Protect your rest and your school work too.","4+ hours":"A lot of time. Make sure you rest and keep school marks first."},
 excite:{"Building things (apps, games, AI tools)":"Projects come first. Competitions are optional extras.","Solving puzzles and competing":"Problem solving and contests come first. Add projects to show your skills.","Both equally":"Balance projects and contests across the year.","Not sure yet":"Try both early and see what you enjoy."},
 funding:{"Need full aid":"Wide list, early research on aid rules, and backup options.","Need partial aid":"Include affordable options and research aid and scholarships early.","Family can pay":"More freedom of choice, but still check costs and rules.","Not applicable":"No funding plan needed."},
 support:{"Yes, someone guides me":"Use your guide's advice and share your progress with them.","Someone supports me but cannot guide on this path":"Use free online resources and find mentors. Share your progress with your supporter.","Mostly on my own":"Use free online resources and communities, and ask teachers for feedback.","Online help only":"Use free online resources and communities, and ask teachers for feedback."}};
 const g=(k)=>M[k][P[k]]||"";
 return[[P.stage+", "+P.curriculum,late?"Applications are close. Focus on tests, your best project and essays.":P.stage==="Class 10"?"About two years to build a strong profile. Focus on projects and strong results.":P.stage==="Class 9"?"About three years to build a strong profile. Start now.":"Several years of runway. Enough time to build real skills, but start now."],
 [P.goal+" · "+P.field,ab?"Aim at strong universities in your field. Wide list, backups, and check official rules.":lo?"Focus on the admission tests and requirements of your target universities.":"Focus on skills and projects you can show to others."],
 ["Marks "+P.marks,g("marks")],["Math feels "+String(P.math).toLowerCase(),g("math")],["Coding: "+String(P.coding).toLowerCase(),g("coding")],["English: "+String(P.english).toLowerCase(),g("english")],
 [P.device+", "+String(P.time).toLowerCase()+" a day",g("time")+(P.device==="Own laptop or PC with internet"?"":" Plan tasks that work with your device and internet.")],
 [P.excite,g("excite")],[P.funding,g("funding")],[P.support,g("support")]]}
function qrender(){
 if(qs==="load"){$("#app").innerHTML='<div class="login card"><h1>Building your roadmap…</h1><p class="mu">This can take up to a minute. Please wait.</p></div>';return}
 if(qs==="sum"){const ai=sb&&user&&!S.aiUsed,ab=ans.goal==="Study abroad"||ans.goal==="University in my country";$("#app").innerHTML=`<div class="sumw card"><h1>Check your answers</h1><p class="mu">${ai?"Happy with them? Confirm to build your personal roadmap. The AI builds it <b>only once</b> for your account, so make sure these are right.":"Confirm to build your roadmap."}${sb&&user&&S.aiUsed?" Your one AI roadmap is already used, so you will get a standard roadmap.":""}</p><table class="st"><tr><th>Starting point (your answers)</th><th>What it means for the plan</th></tr>${sumRows(ans).map(x=>`<tr><td>${E(x[0])}</td><td>${E(x[1])}</td></tr>`).join("")}</table><div class="hn"><b>Honest note:</b> ${ab?"Getting into top universities, especially with full aid, is extremely competitive, even for strong students from any country. Nobody can promise an outcome. This plan raises your chances and, more importantly, makes you much stronger in your field whatever happens. Rules, deadlines and aid policies change every year, so always check each official website before you decide.":"Nobody can promise an outcome. This plan builds real skills and a portfolio that stay useful whatever you choose next. Opportunities and requirements change, so always check official sources."}</div><h2>Anything else we should know? (optional)</h2><textarea id="nt" rows="3" maxlength="300" placeholder="e.g. I want to study robotics in Japan"></textarea><small class="mu">Do not write your name, school, phone or address.</small><div class="row" style="margin-top:12px"><button class="p" data-a="conf">Confirm</button><button class="s" data-a="edit">Edit answers</button></div></div>`;return}
 const q=Q[qi];$("#app").innerHTML=`<div class="login card"><h1>${qi?"":"Welcome! "}Build your roadmap</h1>${qi?"":'<p class="mu">Answer a few quick questions and the app builds a plan for you. Please do not share personal details here.</p>'}${bar(qi/Q.length)}<h2>${qi+1}/${Q.length} · ${q[1]}</h2>${q[2].map(o=>`<button class="blk" data-a="qa" data-k="${E(o)}">${E(o)}</button>`).join("")}${qi?'<button class="s" data-a="qb">Back</button>':""}</div>`}

eng:["📖 English log (+5 XP each)",[["t","Book, piece or new words"],["d","Details / count"]]],
comp:["🏅 Competitions (+20 XP each)",[["n","Competition"],["d","Date"],["r","Result / what I learned"]]],
tests:["📊 Tests: SAT, IELTS, TOEFL... (+20 XP each)",[["n","Test (practice or real)"],["d","Date"],["r","Score"]]],

document.addEventListener("click",async e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,k=el.dataset.k,t=T();if(a==="out")e.preventDefault();
 if(a==="tab")tab=k;
 else if(a==="blk"){const d=S.days[t]=S.days[t]||{b:[],note:""};const had=d.b.length>=BLOCKS.length;d.b=d.b.includes(k)?d.b.filter(x=>x!==k):[...d.b,k];toast(d.b.includes(k)?"+10 XP":"Undone");if(!had&&d.b.length>=BLOCKS.length)toast("⭐ Perfect day! +20 XP bonus")}
 else if(a==="item"){const was=S.items[k];S.items[k]=!was;if(!was)toast("+25 XP")}

 else if(a==="rdel"){S.rewards.splice(k,1)}
 else if(a==="radd2"){const n=$("#rn").value.trim(),c=parseInt($("#rc").value);if(!n||!(c>0))return;S.rewards.push([n,c])}
 else if(a==="ladd"){const f=SECT[k][1],o={};f.forEach(x=>o[x[0]]=$("#f_"+k+"_"+x[0]).value.trim());if(!o[f[0][0]])return;if(k==="unis")o.s=UST[0];S[k].push(o);toast(k==="eng"?"+5 XP":k==="unis"?"Added":"+20 XP")}
 else if(a==="ldel"){const[kk,i]=k.split(".");if(confirm("Delete this entry?"))S[kk].splice(i,1);else return}
 else if(a==="lst"){const u=S.unis[k];u.s=UST[(UST.indexOf(u.s||UST[0])+1)%4];if(u.s==="Submitted")toast("Submitted! +30 XP")}
 else if(a==="qa"){ans[Q[qi][0]]=k;qi++;if(qi>=Q.length)qs="sum"}
 else if(a==="edit"){qs="q";qi=0}
 else if(a==="conf"){const note=($("#nt")||{}).value||"";qs="load";render();let road=null,msg="";
  if(sb&&user&&!S.aiUsed){try{const{data,error}=await sb.functions.invoke("roadmap",{body:{answers:ans,note,base:gen(ans)}});

  S.profile=ans;S.road=road||gen(ans);S.blocks=mkBlocks(ans);ans={};qi=0;qs="q";fix();toast(msg||"Your roadmap is ready!")}
 else if(a==="qb"){qi=Math.max(0,qi-1)}

 else if(a==="wide"){WIDE=!WIDE;localStorage.wide=WIDE?"1":"0"}
